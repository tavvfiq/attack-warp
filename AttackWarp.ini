; AttackWarp.ini - shipped defaults. Lives next to AttackWarp.dll in Data\SKSE\Plugins.
; Your own changes go in AttackWarp_User.ini (the SKSE Menu Framework page writes it); this file is replaced by updates.
; Log: Documents\My Games\Skyrim Special Edition\SKSE\AttackWarp.log
; Distances are centre to centre in game units: bodies touch at about 45, weapon reach is about 145.

[General]
bEnabled=1
; the player's melee attacks
bPlayer=1
; humanoid NPCs (race keyword ActorTypeNPC), toward their combat target
bNPCs=1
; animals and monsters: off, not measured yet
bCreatures=0
; one line per swing in the log
bDebugLog=0

[Target]
; player: at each swing the hostile actor inside this half-angle of your facing is the target (angle and distance decide)
fTargetCone=60
; swings that start further away are left alone
fMaxStartDist=450
; the same for power and charge (sprint) attacks, whose lunges are longer
fMaxStartDistPower=700
; player combos: the previous swing's target stays unless another scores this much better (0 = re-pick freely)
fTargetStickiness=0.3
; with True Directional Movement's target lock on, the locked target is the player's target
bTDMTarget=1

[Stretch]
; before the hit, a lunge that would fall short covers more ground
bStretch=1
fMaxScale=1.8
; only when the target is within this many degrees of straight ahead
fMaxStretchAngle=30
; seconds for the stretch to come in and go out, spring-eased (0 = instant)
fStretchEase=0.12
; full stretch only when the gap left is this much beyond the brake zone; closer it fades out (0 = always full, 0.2.0)
fStretchRange=150
; stretch and turn aim at where a moving target will be this many seconds ahead (0 = off), at most fMaxLead away
fLeadTime=0.25
fMaxLead=80

[Turn]
; while winding up and swinging, turn toward the target; the follow-through keeps its animated facing
bTurn=1
; also the player, except while True Directional Movement steers the player (directional mode or lock-on)
bTurnPlayer=1
; fastest turn, degrees per second
fTurnRate=300
; seconds for the turn to start and settle, spring-eased (0 = rate limit only)
fTurnEase=0.08
; targets further off the facing than this many degrees are not turned to
fMaxTurnAngle=90

[Brake]
; the forward path never comes closer than the stop distance (no pushing into or sliding past the target)
bBrake=1
fStopDistPlayer=70
fStopDistNpc=100
; forward speed tapers smoothly over this many units before the stop (0 = hard stop at the line)
fBrakeZone=60
; seconds to smooth sudden brake changes (target steps in, its body enters your path); 0 = none. The stop line always holds.
fBrakeEase=0.05
; with Precision, stop distance = base + (weapon collision length - fReachRef) x fReachWeight, never inside body contact (45)
bPrecisionReach=1
fReachRef=60
fReachWeight=1.0
